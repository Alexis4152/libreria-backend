# ── DataSource ─────────────────────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ecommerce_libreria}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:admin}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ─────────────────────────────────────────────
# El esquema se gestiona con los scripts en /db (01_schema.sql, 02_seed.sql).
# validate evita que Hibernate altere la estructura ya definida por esos scripts.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ── Server ──────────────────────────────────────────────────────
server.port=${SERVER_PORT:8081}
server.servlet.context-path=/

# ── CORS ────────────────────────────────────────────────────────
# Origenes del frontend permitidos a consumir la API (separados por coma, sin slash final).
# Dev: Vite local. Prod: sobreescribir con la variable de entorno APP_CORS_ALLOWED_ORIGINS.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5174,http://localhost:3000}

# ── Archivos subidos (imagenes de libros, logo de tienda) ────────
app.uploads.dir=${APP_UPLOADS_DIR:uploads}
# URL publica del backend, usada para convertir las rutas relativas de /uploads/** que se
# guardan en BD (ej. "/uploads/books/x.jpg") en URLs absolutas en las respuestas de la API.
# Necesario porque frontend y backend viven en dominios distintos en produccion.
app.public-url=${APP_PUBLIC_URL:}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ── JWT ─────────────────────────────────────────────────────────
# En produccion SIEMPRE sobreescribir APP_JWT_SECRET con una variable de entorno propia.
app.jwt.secret=${APP_JWT_SECRET:ecommerce-libreria-dev-secret-key-change-in-production-2026}
app.jwt.expiration=${APP_JWT_EXPIRATION:86400000}

# ── Jackson ─────────────────────────────────────────────────────
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# ── Pago dummy ──────────────────────────────────────────────────
# AUTO: aprueba si el numero de tarjeta termina en digito par, rechaza si es impar (pruebas).
# ALWAYS_APPROVE / ALWAYS_REJECT fuerzan el resultado.
app.payment.dummy-mode=${APP_PAYMENT_DUMMY_MODE:AUTO}

# ── Correo (ticket de compra) ─────────────────────────────────────
# La configuracion SMTP (host, puerto, usuario, contrasena, habilitado) vive en la tabla
# email_config, no aqui: se administra desde /api/admin/email-config (ver EmailServiceImpl,
# que arma el cliente SMTP en cada envio a partir de esa tabla). Por default queda
# deshabilitada hasta que el ADMIN capture credenciales reales desde el panel.
